# PLOS (Goldsack et al. 2022) -- labelled PLS in the PRD s5 literature table.
# Published reference values: 0.033 (5366.7 -> 175.6 w); FKGL 15.04 -> 14.76
#
# Corpus materialised by `python scripts/fetch_all.py` (seeded draw, n=1000).
# All five anchor configs share identical run parameters so their profiles are
# directly comparable: M1-M3 over all 1000 pairs, M4-M6 over a seeded 250-pair
# sample, real SBERT + NLI backends.
dataset:
  adapter: jsonl
  path: data/plos/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: plos
  # Reduced from the 250 the other anchors use. PLOS documents average ~6,750
  # source words and M5 scores every target sentence against every source
  # sentence, so 250 pairs needs hours of uninterrupted CPU -- two attempts were
  # lost to the machine sleeping. M1-M3 still run on all 1000.
  # Consequence: PLOS's M4-M6 confidence intervals are wider than the other
  # corpora's. Every metric carries its own n, so this stays visible.
  sample_size: 60          # M4-M6 sample; M1-M3 run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  # Widened past 0.6 and m6_tau raised to 0.7 on evidence. Validated per
  # sentence against SWiPE's human deletion annotations (1,073 source sentences,
  # scripts/validate_deletion_split.py): Cohen's kappa runs 0.462 at tau=0.5
  # against 0.767 at 0.7 and 0.775 at 0.75, and the pipeline's deletion rate
  # only matches the annotators' (50% vs 52.5%) from 0.7 upward. At 0.5 recall
  # is 0.497 -- half of what annotators call a deletion is missed, because a
  # sentence that loses half its content still aligns through the surviving
  # half. 0.7 rather than 0.75 because precision is still 0.909 there and falls
  # away above it. Validated on Wikipedia prose only; whether it transfers to
  # Cochrane or PLOS is untested, which is why the sweep now spans it.
  tau_sweep: [0.4, 0.5, 0.6, 0.7, 0.8]
  m6_tau: 0.7
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile]
