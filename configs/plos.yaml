# PLOS (Goldsack et al. 2022) -- labelled PLS in the PRD s5 literature table.
# Published reference values: 0.033 (5366.7 -> 175.6 w); FKGL 15.04 -> 14.76
#
# Corpus materialised by `python scripts/fetch_all.py` (seeded draw, n=1000).
# All five anchor configs share identical run parameters so their profiles are
# directly comparable: M1-M3 and M7 over all 1000 pairs, M3d, M4, M5 and M8
# over a seeded 250-pair sample, real model backends (no run.stand_ins).
dataset:
  adapter: jsonl
  path: data/plos/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: plos
  # Reduced from the 250 the other anchors use. PLOS documents average ~6,750
  # source words and M5's NLI scorer (removed in the October 2026 metric
  # revision) scored every target sentence against every source sentence, so
  # 250 pairs needed hours of uninterrupted CPU -- two attempts were lost to the
  # machine sleeping. M1-M3 still run on all 1000.
  # Consequence: PLOS's sampled-module confidence intervals are wider than the
  # other corpora's. Every metric carries its own n, so this stays visible.
  sample_size: 60          # M3d/M4/M5/M8 sample; the rest run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  device: auto             # mps here
modules: [length, abstractiveness, readability, alignment, elaboration,
          linguistic_features, pair_similarity]
