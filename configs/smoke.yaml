# Fully offline smoke config: deterministic stand-in backends, no model
# downloads. Runs every module end-to-end on data/smoke.jsonl.
dataset:
  adapter: jsonl
  path: data/smoke.jsonl
  source_field: reference
  target_field: summary
run:
  sample_size: null
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 200
  # Offline stand-ins for M3d (SLE, coherence) and M5 (document-level SummaC,
  # rhetorical roles): no model download; flagged in notes, not the published
  # metrics.
  stand_ins: true
modules: [length, abstractiveness, readability, alignment, elaboration]
