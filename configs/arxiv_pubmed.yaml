# arXiv/PubMed (Cohan et al. 2018) -- the biomedical SUM cell.
# Research article -> its own author-written abstract.
#
# No published compression figure: the paper reports document and summary
# lengths but not a ratio, so PUBLISHED_COMPRESSION carries "--" rather than an
# invented number. Measured here: 0.066 (3121.2 -> 204.3 whitespace words).
#
# Why this corpus completes the grid: every biomedical target already in the
# repo (Cochrane, PLOS, eLife) is written for a lay reader, so the domain had
# no cell where compression happens *without* simplification. PubMed's target
# is an abstract -- shorter than the source and just as technical -- which is
# exactly that control, inside the same domain.
#
# Corpus materialised by `python scripts/fetch_all.py --only arxiv_pubmed`
# (seeded stratified draw across the row groups of all five shards, n=1000).
dataset:
  adapter: jsonl
  path: data/arxiv_pubmed/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: arxiv_pubmed
  # 250, not the 60 eLife uses, even though mean source length (3,121
  # whitespace words) just clears the 3,000-token line that triggered eLife's
  # reduction. That line is a proxy for M5 cost, and here the proxy misreads
  # the corpus. M5 scores every target sentence against every source sentence,
  # so its cost is the *product*: PubMed averages 104.6 source x 7.8 target
  # sentences = ~850 passes per document, against eLife's 611.8 x 18.1 =
  # ~11,084. At 250 documents PubMed is ~212,500 passes, under a third of the
  # ~665,000 eLife ran at 60 documents in 6.3 hours. Holding 250 keeps the CIs
  # comparable with the other anchors at a fraction of eLife's cost.
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  tau_sweep: [0.4, 0.5, 0.6, 0.7, 0.8]
  # 0.5, the non-Wikipedia default, and UNVALIDATED for this genre. The 0.7
  # that scripts/validate_deletion_split.py validated against SWiPE's human
  # deletion labels is Wikipedia prose with MiniLM and does not transfer; the
  # existing anchors all carry the same caveat. No human-annotated subset
  # exists for this corpus, so nothing here can be validated the way SWiPE
  # was. The sweep below reports the alternatives so the sensitivity is
  # visible rather than hidden behind one number.
  #
  # The threshold is genre-dependent, so a single global value is wrong; see
  # docs/modules/m4-alignment.md.
  m6_tau: 0.5
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile,
          linguistic_features, pair_similarity]
