# XSum (Narayan et al. 2018) -- labelled SUM in the PRD s5 literature table.
# BBC article -> its single-sentence summary.
#
# Published reference values: 0.054 (431 -> 23.3 w). Measured here: 0.057
# (370.5 -> 21.0 w), the closest agreement of any corpus in the set.
#
# Paired with CNN/DailyMail to test whether SUM is a coherent class. The two sit
# at opposite ends of summarization style: CNN/DailyMail's highlights are
# largely copied (coverage 0.855, novel unigrams 0.145) while XSum is
# deliberately abstractive, so agreement between them is evidence a metric
# tracks the task rather than the style.
#
# Corpus materialised by `python scripts/fetch_all.py --only xsum` (seeded
# stratified draw across row groups, n=1000).
#
# Run parameters match the other anchors so the profiles stay comparable.
dataset:
  adapter: jsonl
  path: data/xsum/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: xsum
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  # Widened past 0.6 and m6_tau raised to 0.7 on evidence. Validated per
  # sentence against SWiPE's human deletion annotations (1,073 source sentences,
  # scripts/validate_deletion_split.py): Cohen's kappa runs 0.462 at tau=0.5
  # against 0.767 at 0.7 and 0.775 at 0.75, and the pipeline's deletion rate
  # only matches the annotators' (50% vs 52.5%) from 0.7 upward. At 0.5 recall
  # is 0.497 -- half of what annotators call a deletion is missed, because a
  # sentence that loses half its content still aligns through the surviving
  # half. 0.7 rather than 0.75 because precision is still 0.909 there and falls
  # away above it. Validated on Wikipedia prose only; whether it transfers to
  # Cochrane or PLOS is untested, which is why the sweep now spans it.
  tau_sweep: [0.4, 0.5, 0.6, 0.7, 0.8]
  m6_tau: 0.7
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile]
