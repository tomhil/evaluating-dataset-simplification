# OneStopEnglish (Vajjala & Lučić 2018) -- the news DS cell.
# Guardian article, Advanced version -> the teacher-written Elementary version.
#
# Published reference values: 0.650 (820.49 -> 533.17 w), mean words per level
# from Vajjala & Lučić's Table 2; they report lengths, not a ratio. Measured
# here: 0.648 (824.8 -> 534.6 whitespace words).
#
# SMALLER BASE THAN EVERY OTHER CORPUS. The corpus is 189 articles in total, so
# M1-M3 run on 189 rather than the 1,000 the others use, and every confidence
# interval here is correspondingly wider -- wider even than Contracts' 446.
# Each metric carries its own n, so this stays visible in the report.
#
# AUDIENCE WARNING. The Elementary version is written for adult learners of
# English, not children, and the Advanced source is close to the Guardian
# original but not identical to it.
#
# Corpus materialised by `python scripts/fetch_all.py --only onestop`
# (whole corpus at commit 37f8db3, seeded shuffle; the [SHORT] note the fetcher
# prints is expected here).
dataset:
  adapter: jsonl
  path: data/onestop/all_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: onestop
  # 250, matching the anchors' sample size. It exceeds the 189 available, so
  # M4-M6 run on every pair.
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 189
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  device: auto             # mps here
modules: [length, abstractiveness, readability, alignment, elaboration,
          linguistic_features, pair_similarity]
