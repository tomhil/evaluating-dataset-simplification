# OneStopEnglish (Vajjala & Lučić 2018) -- the news DS cell.
# Guardian article, Advanced version -> the teacher-written Elementary version.
#
# Published reference values: 0.650 (820.49 -> 533.17 w), mean words per level
# from Vajjala & Lučić's Table 2; they report lengths, not a ratio. Measured
# here: 0.648 (824.8 -> 534.6 whitespace words).
#
# SMALLER BASE THAN EVERY OTHER CORPUS. The corpus is 189 articles in total, so
# M1-M3 run on 189 rather than the 1,000 the others use, and every confidence
# interval here is correspondingly wider -- wider even than Contracts' 446.
# Each metric carries its own n, so this stays visible in the report.
#
# AUDIENCE WARNING. The Elementary version is written for adult learners of
# English, not children, and the Advanced source is close to the Guardian
# original but not identical to it.
#
# Corpus materialised by `python scripts/fetch_all.py --only onestop`
# (whole corpus at commit 37f8db3, seeded shuffle; the [SHORT] note the fetcher
# prints is expected here).
dataset:
  adapter: jsonl
  path: data/onestop/all_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: onestop
  # 250, matching the anchors' sample size. It exceeds the 189 available, so
  # M4-M6 run on every pair.
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 189
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  tau_sweep: [0.4, 0.5, 0.6, 0.7, 0.8]
  # 0.5, the non-Wikipedia default, and UNVALIDATED for news prose. The 0.7
  # that scripts/validate_deletion_split.py validated against SWiPE's human
  # deletion labels is Wikipedia prose with MiniLM and does not transfer; every
  # existing anchor carries the same caveat. No human-annotated news subset
  # is in use, so nothing here can be validated the way SWiPE was -- the sweep
  # below reports the alternatives so the sensitivity stays visible.
  #
  # The threshold is genre-dependent, so a single global value is wrong; see
  # docs/modules/m4-alignment.md.
  m6_tau: 0.5
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile,
          linguistic_features, pair_similarity]
