# SWiPE-gold (Laban et al. 2023) -- the 3,861-pair manually annotated subset.
#
# Profiled to validate M4 and M5 against human labels, NOT as a corpus profile.
# Annotators selected pairs carrying interesting edits, so this subset measures
# 0.504 compression against the full corpus's 0.676; it is a biased sample and
# its corpus-level figures do not describe SWiPE. Use configs/swipe.yaml for
# that.
#
# Each pair carries human edit annotations whose categories are ground truth for
# what M4 and M5 estimate:
#   syntactic_sentence_splitting   -> M4 n_1_n_split
#   semantic_deletion              -> M4 n_1_0_deletion
#   semantic_elaboration_*         -> M5 not-entailed rate
#   discourse_reordering           -> M4 kendall_tau
# scripts/validate_against_swipe.py performs the join and the correlation.
#
# Run parameters match the other anchors so the numbers stay comparable.
dataset:
  adapter: jsonl
  path: data/swipe_gold/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: swipe_gold
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  tau_sweep: [0.4, 0.5, 0.6]
  m6_tau: 0.5
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile]
