# CNN/DailyMail -- labelled SUM in the PRD s5 literature table.
# Published reference values: ~0.08 (~700 -> ~53 w); the generic-summarization control
#
# Corpus materialised by `python scripts/fetch_all.py` (seeded draw, n=1000).
# All five anchor configs share identical run parameters so their profiles are
# directly comparable: M1-M3 and M7 over all 1000 pairs, M3d, M4, M5 and M8
# over a seeded 250-pair sample, real model backends (no run.stand_ins).
dataset:
  adapter: jsonl
  path: data/cnn_dailymail/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: cnn_dailymail
  sample_size: 250         # M3d/M4/M5/M8 sample; the rest run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  device: auto             # mps here
modules: [length, abstractiveness, readability, alignment, elaboration,
          linguistic_features, pair_similarity]
