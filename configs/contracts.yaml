# Plain English Summarization of Contracts (Manor & Li 2019) -- the legal PLS
# cell. Contract / terms-of-service text -> a plain-English summary written for
# a non-lawyer.
#
# No published compression ratio. Measured here: 0.157 (101.9 -> 16.0
# whitespace words).
#
# SMALLER BASE THAN EVERY OTHER CORPUS. The corpus is 446 pairs in total, so
# M1-M3 run on 446 rather than the 1,000 the others use, and every confidence
# interval here is correspondingly wider. Each metric carries its own n, so
# this stays visible in the report.
#
# GRANULARITY WARNING. Section-level, not whole documents: sources average
# 101.9 words / 3.6 sentences and targets 16.0 words / 1.2 sentences. Its M1
# compression is not comparable with a full-document corpus's. Some targets are
# extremely short -- the shortest is a single word, and "hi." is a real
# reference summary in the released file -- which the pipeline's degenerate-pair
# handling flags rather than averaging away silently.
#
# Corpus materialised by `python scripts/fetch_all.py --only contracts`
# (whole corpus; the [SHORT] note the fetcher prints is expected here).
dataset:
  adapter: jsonl
  path: data/contracts/all_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: contracts
  # 250 of the 446 available, matching the anchors' sample size so the M4-M6
  # CIs are read the same way. Cost is negligible at ~6 M5 passes per pair.
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 446
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  tau_sweep: [0.4, 0.5, 0.6, 0.7, 0.8]
  # 0.5, the non-Wikipedia default, and UNVALIDATED for legal prose. The 0.7
  # that scripts/validate_deletion_split.py validated against SWiPE's human
  # deletion labels is Wikipedia prose with MiniLM and does not transfer; every
  # existing anchor carries the same caveat. No human-annotated legal subset
  # exists, so nothing here can be validated the way SWiPE was -- the sweep
  # below reports the alternatives so the sensitivity stays visible.
  #
  # The threshold is genre-dependent, so a single global value is wrong; see
  # docs/modules/m4-alignment.md.
  m6_tau: 0.5
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile,
          linguistic_features, pair_similarity]
