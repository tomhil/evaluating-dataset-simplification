# Plain English Summarization of Contracts (Manor & Li 2019) -- the legal PLS
# cell. Contract / terms-of-service text -> a plain-English summary written for
# a non-lawyer.
#
# No published compression ratio. Measured here: 0.157 (101.9 -> 16.0
# whitespace words).
#
# SMALLER BASE THAN EVERY OTHER CORPUS. The corpus is 446 pairs in total, so
# M1-M3 run on 446 rather than the 1,000 the others use, and every confidence
# interval here is correspondingly wider. Each metric carries its own n, so
# this stays visible in the report.
#
# GRANULARITY WARNING. Section-level, not whole documents: sources average
# 101.9 words / 3.6 sentences and targets 16.0 words / 1.2 sentences. Its M1
# compression is not comparable with a full-document corpus's. Some targets are
# extremely short -- the shortest is a single word, and "hi." is a real
# reference summary in the released file -- which the pipeline's degenerate-pair
# handling flags rather than averaging away silently.
#
# Corpus materialised by `python scripts/fetch_all.py --only contracts`
# (whole corpus; the [SHORT] note the fetcher prints is expected here).
dataset:
  adapter: jsonl
  path: data/contracts/all_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: contracts
  # 250 of the 446 available, matching the anchors' sample size so the M4-M6
  # CIs are read the same way. Cost is negligible at ~6 M5 passes per pair.
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 446
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  device: auto             # mps here
modules: [length, abstractiveness, readability, alignment, elaboration,
          linguistic_features, pair_similarity]
