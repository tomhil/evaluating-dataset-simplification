# BillSum (Kornilova & Eidelman 2019) -- the legal SUM cell.
# US Congressional bill -> the Congressional Research Service's summary.
#
# No published compression ratio; the paper reports token-length distributions
# rather than a ratio, so PUBLISHED_COMPRESSION carries "--". Measured here:
# 0.135 (1287.8 -> 174.1 whitespace words).
#
# CC0, and the summaries are written by CRS analysts, so this is a human
# transformation -- the property that disqualified SIMPLE-LAW for the legal DS
# cell (see docs/DATASETS.md).
#
# Corpus materialised by `python scripts/fetch_all.py --only billsum`
# (seeded stratified draw across row groups, n=1000).
dataset:
  adapter: jsonl
  path: data/billsum/train_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: billsum
  # 250, matching the anchors. Cheap: 45.4 source x 4.9 target sentences is
  # ~256 M5 passes per document, ~64,000 at 250 documents, against eLife's
  # ~665,000 at 60.
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  tau_sweep: [0.4, 0.5, 0.6, 0.7, 0.8]
  # 0.5, the non-Wikipedia default, and UNVALIDATED for legal prose. The 0.7
  # that scripts/validate_deletion_split.py validated against SWiPE's human
  # deletion labels is Wikipedia prose with MiniLM and does not transfer; every
  # existing anchor carries the same caveat. No human-annotated legal subset
  # exists, so nothing here can be validated the way SWiPE was -- the sweep
  # below reports the alternatives so the sensitivity stays visible.
  #
  # The threshold is genre-dependent, so a single global value is wrong; see
  # docs/modules/m4-alignment.md.
  m6_tau: 0.5
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile,
          linguistic_features, pair_similarity]
