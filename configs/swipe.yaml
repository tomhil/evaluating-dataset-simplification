# SWiPE (Laban et al. 2023) -- labelled DS in the PRD s5 literature table.
# English Wikipedia -> Simple English Wikipedia, document-aligned.
#
# Published reference values: the literature table records "~1
# (content-preserving)". Measured over all 143,359 pairs of the released corpus
# the compression ratio is 0.676, so that entry is not supported as a length
# figure; it likely describes meaning preservation rather than length.
#
# Corpus materialised by `python scripts/fetch_all.py --only swipe` (reservoir
# sample over the full 190MB corpus, seeded, n=1000). Note that n=1000 gives a
# corpus-level ratio of 0.552 against the true 0.676: target lengths are
# heavy-tailed and a thousand draws under-sample the tail.
#
# Run parameters match the other anchors so the profiles stay comparable.
dataset:
  adapter: jsonl
  path: data/swipe/full_1000.jsonl
  source_field: source
  target_field: target
run:
  dataset_label: swipe
  sample_size: 250         # M4-M6 sample; M1-M3 run on all 1000
  seed: 13
  language: en
  cache_dir: .cache/
  bootstrap_resamples: 1000
  embedder: sbert
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  nli_backend: nli
  nli_model: microsoft/deberta-large-mnli
  device: auto             # mps here; deberta-large is ~4x cpu
  nli_threshold: 0.5
  tau_sweep: [0.4, 0.5, 0.6]
  m6_tau: 0.5
  # One shared technical-term list across all five corpora, so M3b/M6
  # jargon_rate is comparable between them rather than domain-tuned per corpus.
  jargon_terms:
    - randomised
    - randomized
    - placebo
    - trial
    - trials
    - meta-analysis
    - systematic
    - efficacy
    - intervention
    - interventions
    - outcome
    - outcomes
    - clinical
    - dose
    - dosage
    - adverse
    - mortality
    - morbidity
    - prognosis
    - incidence
    - prevalence
    - cohort
    - baseline
    - statistically
    - significance
    - hypothesis
    - methodology
    - empirical
    - correlation
    - regression
    - coefficient
    - parameter
    - mechanism
    - molecular
    - cellular
    - protein
    - gene
    - genome
    - enzyme
    - receptor
    - pathway
    - inhibitor
    - expression
    - phenotype
    - in-vitro
    - in-vivo
modules: [length, abstractiveness, readability, alignment, elaboration, deletion_profile]
