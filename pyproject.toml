[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-task-profiler"
version = "0.1.0"
description = "Descriptive metric profiler for parallel document corpora (source -> target)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    # Range-reads remote parquet shards in scripts/fetch_all.py.
    "fsspec>=2023.1",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "textstat==0.7.3",
    "wordfreq>=3.0",
    # Progress reporting when a TTY is attached; the fallback needs no deps.
    "tqdm>=4.60",
]

[project.optional-dependencies]
models = ["spacy>=3.7", "sentence-transformers>=2.2", "transformers>=4.35", "torch>=2.0", "datasets>=2.14"]
dev = ["pytest>=7.4"]

[project.scripts]
profiler = "profiler.__main__:main"

[tool.setuptools.packages.find]
include = ["profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
